# discipline of not reaching past their own backlog item):
#   - No CLI/admin/tools container: `peer channel join`, `osnadmin channel
#     join`, chaincode lifecycle — NET-3/NET-5/CC-5's scope, not this file's.
#   - No chaincode / external-builder / docker.sock mount: no chaincode
#     package exists yet (CC-1..5); adding the docker.sock bind now would be
#     an unused privilege escalation.
#   - No CouchDB service: ADR-0007 ratifies LevelDB; CORE_LEDGER_STATE_
#     STATEDATABASE=goleveldb on every peer above is this file's compliance
#     evidence, not a re-decision (that decision is fabric-performance's/
#     ADR-0007's, not this item's to reopen).
#   - No PDC / collections-config.json (ADR-0015 retires PDC entirely).
#   - No Docker `healthcheck:` blocks: the operations `/healthz` endpoint is
#     stood up (see host-published operations ports above) but this file does
#     not assume the base images ship a suitable HTTP client for a compose-
#     level healthcheck probe — left to the orchestrator's own external check
#     rather than asserted here as verified.
# =============================================================================

# =============================================================================
# ca-org3-config.yaml — fabric-ca-server config for Org3 (auditor org)
# =============================================================================
# Backlog item: NET-2. See ca-org1-config.yaml's header for the full
# authorization basis, design authority, combined-identity-plus-TLS-CA
# rationale + alternatives, and VERIFY-schema-provenance notes — all of that
# applies identically here and is NOT repeated (no duplication, AUTHORING-
# CONTRACT.md §7). This header states only what differs for this org.
#
# NAMING (reused exactly from NET-1): domain "org3" -> Org3MSP.
#
# OWNERSHIP NOTE (NET-DESIGN §1, unchanged by this file): Org3's real-world
# operator identity is **TBD** — not fixed by any ratified requirement (gap
# G-04 residual). This file does not resolve that; it stands up the
# technical CA a chosen auditor-operator would eventually run. It is
# scaffolded by fabric-architect for the prototype exactly as NET-1
# scaffolded this org's configtx/crypto-config entries.
#
# ENDORSEMENT NOTE (out of this file's scope, restated only as a pointer):
# Org3 never endorses (ADR-0012 §1/§5, NET-5's scope) — that is an
# endorsement-POLICY fact enforced at the channel/chaincode-commit level, not
# something a CA server config encodes. Nothing here grants or withholds
# endorsement capability; peer0.org3's role in the AND-endorsement principal
# set is fixed by NET-5, independent of this CA.
# =============================================================================

version: 1.5.15   # [VERIFY] pin to the exact hyperledger/fabric-ca:1.5.x patch actually deployed

port: 7054

debug: false

crlsizelimit: 512000

tls:
  enabled: true
  certfile:              # [VERIFY] see ca-org1-config.yaml's tls note
  keyfile:
  clientauth:
    type: noclientcert

ca:
  name: ca-org3
  keyfile:
  certfile:
  chainfile:

crl:
  expiry: 24h

registry:
  maxenrollments: -1
  identities:
    - name: admin-org3
      pass: org3AdminPW2026
      type: client
      affiliation: ""
      attrs:
        hf.Registrar.Roles: "*"                          # [VERIFY: fabric-ca docs — attributes]
        hf.Registrar.DelegateRoles: "*"                   # [VERIFY: fabric-ca docs — attributes]
        hf.Registrar.Attributes: "hris.role,hris.company,hf.Registrar.Roles,hf.Registrar.DelegateRoles,hf.Revoker,hf.GenCRL"
          # [VERIFY: fabric-ca docs — attributes] — kept symmetric with the other two orgs even
          # though this prototype does not currently plan to enroll an hris.*-bearing identity
          # under ca.org3 (Org3 is read-only/non-endorsing) — no functional use yet, disclosed.
        hf.Revoker: true
        hf.GenCRL: true
        hf.AffiliationMgr: true
        hf.IntermediateCA: true

db:
  type: sqlite3
  datasource: fabric-ca-server.db
  tls:
    enabled: false

ldap:
  enabled: false

# One top-level affiliation matching this org's domain ("org3"). Distinct
# from NodeOU role classification and from the hris.* ABAC attributes — see
# ca-org1-config.yaml's affiliations note (applies identically here).
affiliations:
  org3:
    - auditor

signing:
  default:
    usage:
      - digital signature
    expiry: 8760h
  profiles:
    ca:
      usage:
        - cert sign
        - crl sign
      expiry: 131400h
      caconstraint:
        isca: true
        maxpathlen: 0
    tls:
      usage:
        - signing
        - key encipherment
        - server auth
        - client auth
      expiry: 8760h

csr:
  cn: ca-org3
  keyrequest:
    algo: ecdsa
    size: 256
  names:
    - C: ID
      ST: Jakarta
      O: Org3
      OU: auditor
  hosts:
    - localhost
    - 127.0.0.1
    - ca.org3              # matches this CA's docker-compose service name/hostname
  ca:
    expiry: 131400h
    pathlength: 1

idemix:
  rhpoolsize: 100
  nonceexpiration: 15s
  nonceweeksize: 60         # inert — see ca-org1-config.yaml's idemix note

# See ca-org1-config.yaml's bccsp note: SW is a design-stage placeholder, not
# a production HSM decision. TLS keys stay file-based unconditionally.
bccsp:
  default: SW
  sw:
    hash: SHA2
    security: 256

cfg:
  identities:
    allowremove: false
  affiliations:
    allowremove: false

operations:
  listenAddress: 127.0.0.1:9443
  tls:
    enabled: false          # [VERIFY] — not exposed in ca-docker-compose.yaml; out of NET-2 scope

# Backlog item: DEP-1 (agent-suite/06-roadmap/implementation-backlog.md)
#   "Helm chart — Fabric network (Org1: 2 peers + 3 orderers; a per-tenant
#   OrgClient-<tenantID> peer template) on the platform's cloud K8s"
# Traces to: ADR-0012 (three-org topology, Raft sizing), ADR-0013

#   anchor-service/consumer workload), NET-DESIGN §6 (Transport & deployment).
#
# STANDING SCOPE NOTE (binding, restated from the task authorization — see
# this chart's own README.md for the full statement): this chart is a GENERIC,
# REVIEWABLE ARTIFACT ONLY. It translates
# fabric-network/network/compose/{network,ca}-docker-compose.yaml into
# Kubernetes primitives for design review. It has never been `helm install`-ed
# or `helm template`-d against a real or test cluster — no cluster, real or
# local (kind/minikube), was created or touched to produce this chart. Treat
# every value below as a reviewable default, not a validated one.
# =============================================================================
apiVersion: v2
